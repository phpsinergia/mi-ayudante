<VirtualHost {DOMINIO}:80>
    DocumentRoot "{RUTA_RAIZ}/{DIR_PUBLICO}"
    ServerName {DOMINIO}
    ErrorLog "{RUTA_LOGS}/http_error.log"
	php_value error_log "{RUTA_LOGS}/http_error.log"
	<Directory "{RUTA_RAIZ}/{DIR_PUBLICO}">
		Options Indexes FollowSymLinks Includes ExecCGI
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
<VirtualHost {DOMINIO}:443>
    DocumentRoot "{RUTA_RAIZ}/{DIR_PUBLICO}"
    ServerName {DOMINIO}
    ErrorLog "{RUTA_LOGS}/http_error.log"
	php_value error_log "{RUTA_LOGS}/http_error.log"
    SSLEngine on
    SSLCertificateFile "{RUTA_HOST}/cert.pem"
    SSLCertificateKeyFile "{RUTA_HOST}/key.pem"
	<Directory "{RUTA_RAIZ}/{DIR_PUBLICO}">
		Options All
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
